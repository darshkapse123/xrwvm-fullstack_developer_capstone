
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Dealerships</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/bootstrap.min.css">

    <script>
        const logout = async (e) => {
            // Logout functionality will be implemented here.
        };

        const checkSession = () => {
            let curr_user = sessionStorage.getItem("username");
            const loginlogout = document.getElementById("loginlogout");

            if (curr_user && curr_user !== "") {
                loginlogout.innerHTML =
                    '<span class="homepage_links">' + curr_user + '</span>' +
                    '<a class="homepage_links" onclick="logout()" href="/">Logout</a>';
            } else {
                loginlogout.innerHTML =
                    '<a class="homepage_links" href="/login">Login</a>' +
                    '<a class="homepage_links" href="/register">Register</a>';
            }
        };
    </script>
</head>

<body onload="checkSession()">

    <nav class="navbar navbar-expand-lg navbar-light"
         style="background-color: darkturquoise; min-height: 1in;">

        <div class="container-fluid">

            <h2 style="padding-right: 5%;">Dealerships</h2>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarText"
                    aria-controls="navbarText"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarText">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active"
                           style="font-size: larger;"
                           aria-current="page"
                           href="/">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           style="font-size: larger;"
                           href="/about">About Us</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           style="font-size: larger;"
                           href="/contact">Contact Us</a>
                    </li>

                </ul>

                <span class="navbar-text">
                    <div class="loginlink" id="loginlogout"></div>
                </span>

            </div>
        </div>
    </nav>

    <div style="display: flex; flex-direction: column;">

        <div class="card"
             style="width: 50%; margin-top: 50px; align-self: center;">

            <img src="/static/car_dealership.jpg"
                 class="card-img-top"
                 alt="Car Dealership">

            <div class="banner">

                <h5>Welcome to our Dealerships!</h5>

                <a href="/djangoapp/dealers"
                   class="btn"
                   style="background-color: aqua; margin: 10px;">

                    View Dealerships

                </a>

            </div>
        </div>
    </div>
    <div class="container mt-5">
      <h2 class="text-center mb-4">Available Dealerships</h2>
  
      <div class="table-responsive">
          <table class="table table-bordered table-striped">
              <thead class="table-dark">
                  <tr>
                      <th>ID</th>
                      <th>Dealer Name</th>
                      <th>City</th>
                      <th>Address</th>
                      <th>Zip</th>
                      <th>State</th>
                  </tr>
              </thead>
              <tbody id="dealers-list">
                  <tr>
                      <td colspan="6">Loading dealerships...</td>
                  </tr>
              </tbody>
          </table>
      </div>
  </div>
  
  <script>
      async function loadDealers() {
          const table = document.getElementById("dealers-list");
  
          try {
              const response = await fetch("/djangoapp/dealers");
              const dealers = await response.json();
  
              if (!response.ok || !Array.isArray(dealers)) {
                  throw new Error("Unable to load dealerships");
              }
  
              table.innerHTML = "";
  
              dealers.forEach(dealer => {
                  const row = document.createElement("tr");
  
                  [
                      dealer.id,
                      dealer.full_name,
                      dealer.city,
                      dealer.address,
                      dealer.zip,
                      dealer.state
                  ].forEach(value => {
                      const cell = document.createElement("td");
                      cell.textContent = value ?? "";
                      row.appendChild(cell);
                  });
  
                  table.appendChild(row);
              });
  
          } catch (error) {
              table.innerHTML =
                  '<tr><td colspan="6">Unable to load dealerships.</td></tr>';
              console.error(error);
          }
      }
  
      loadDealers();
  </script>
</body>
</html>
